name: Credential-free CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  quality:
    name: Pure C# quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Allrpcs.sln --disable-parallel -m:1 /nr:false

      - name: Verify formatting
        run: dotnet format Allrpcs.sln --no-restore --verify-no-changes

      - name: Build with zero warnings
        run: dotnet build Allrpcs.sln --no-restore -m:1 /nr:false

      - name: Run solution tests
        run: dotnet test Allrpcs.sln --no-build

      - name: Validate representative discovery scenario
        run: dotnet run --project tools/ScenarioValidator/Allrpcs.ScenarioValidator.csproj --no-build --no-restore

  python-tooling:
    name: Python tooling and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"

      - name: Install speech worker test dependency
        run: python3 -m pip install --no-cache-dir numpy==2.5.3

      - name: Validate workflows
        run: ./scripts/validate-workflows.sh

      - name: Run continuation checker self-test
        run: python3 scripts/check-continuation.py --self-test

      - name: Run player speech worker tests
        run: python3 scripts/test-player-speech-worker.py

      # quality.py --self-test is not run here: it passes with a plain python3 (no venv), but one
      # contract test reads quality.py at a historical revision (git show HERB_REVISION:quality.py),
      # so it fails in this shallow checkout and would need fetch-depth: 0 on the ~2.4 GB history.
      - name: Compile live Python tooling
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m py_compile quality.py scripts/check-continuation.py scripts/*-speech-worker.py

  godot-smoke:
    name: Headless Godot smoke
    runs-on: ubuntu-24.04
    # Roughly 330 launches take about 8 minutes locally (Apple silicon); a hosted runner is slower
    # and several checks wait on wall-clock model deadlines, so keep generous headroom.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Godot 4.6.3 .NET
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.6.3
          use-dotnet: true
          include-templates: false

      - name: Restore
        run: dotnet restore Allrpcs.sln --disable-parallel -m:1 /nr:false

      - name: Build with zero warnings
        run: dotnet build Allrpcs.sln --no-restore -m:1 /nr:false

      - name: Launch main scene headlessly
        run: ./scripts/smoke-godot.sh

  development-build:
    name: Unsigned development build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux x64
            runner: ubuntu-24.04
            artifact_id: linux-x64
          - target: macOS Universal 2
            runner: macos-15
            artifact_id: macos-universal
          - target: Windows x64
            runner: windows-2025
            artifact_id: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Godot 4.6.3 .NET and export templates
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.6.3
          use-dotnet: true
          include-templates: true

      - name: Restore
        run: dotnet restore Allrpcs.sln --disable-parallel -m:1 /nr:false

      - name: Export unsigned debug build
        run: ./scripts/export-development.sh "${{ matrix.artifact_id }}"

      - name: Verify macOS bundle has no bundle signature
        if: matrix.artifact_id == 'macos-universal'
        run: |
          mkdir -p "${RUNNER_TEMP}/allrpcs-macos-verification"
          unzip -q artifacts/unsigned-development/macos-universal/Allrpcs-macOS.zip \
            -d "${RUNNER_TEMP}/allrpcs-macos-verification"
          test -d "${RUNNER_TEMP}/allrpcs-macos-verification/Allrpcs.app" || { echo "Allrpcs.app missing" >&2; exit 1; }
          if codesign --verify --deep --strict \
            "${RUNNER_TEMP}/allrpcs-macos-verification/Allrpcs.app"; then
            echo "Expected an unsigned macOS development bundle." >&2
            exit 1
          fi

      - name: Verify Windows executable has no Authenticode signature
        if: matrix.artifact_id == 'windows-x64'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "artifacts/unsigned-development/windows-x64/Allrpcs.exe"
          if ($signature.Status -ne "NotSigned") {
            throw "Expected an unsigned Windows development executable; status was $($signature.Status)."
          }

      - name: Upload explicitly unsigned development evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNSIGNED-DEVELOPMENT-${{ matrix.artifact_id }}
          path: artifacts/unsigned-development/${{ matrix.artifact_id }}/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
